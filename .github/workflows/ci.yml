name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openclaw: ["2026.10.9", "2026.11.1", "2026.11.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:syntax
      - name: Download pristine package and matching AI dependency
        env:
          OPENCLAW_VERSION: ${{ matrix.openclaw }}
        run: |
          cd "$RUNNER_TEMP"
          npm pack "openclaw@$OPENCLAW_VERSION" "@openclaw/ai@$OPENCLAW_VERSION"
          mkdir -p fixture/package/node_modules/@openclaw/ai
          tar -xzf "openclaw-$OPENCLAW_VERSION.tgz" -C fixture
          tar -xzf "openclaw-ai-$OPENCLAW_VERSION.tgz" --strip-components=1 -C fixture/package/node_modules/@openclaw/ai
      - name: Apply, check, functional regressions, idempotence and version guard
        run: npm run test:kit -- "$RUNNER_TEMP/fixture/package"
